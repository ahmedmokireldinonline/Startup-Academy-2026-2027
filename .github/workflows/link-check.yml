name: Check links

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          failIfNoHits: false
          args: >-
            --verbose
            --no-progress
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
