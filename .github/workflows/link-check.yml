name: Check links and freshness

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and generate catalog data
        run: pnpm data:check
      - name: TypeScript check
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Build static app
        run: pnpm build:static

  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          failIfNoHits: false
          args: >-
            --verbose
            --no-progress
            --accept 403
            --insecure
            --timeout 60
            --max-retries 3
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  stale-entries:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Flag entries not verified in 90+ days
        shell: python
        run: |
          import csv
          import datetime as dt
          import os
          from pathlib import Path

          today = dt.date.today()
          stale = []
          with Path('programs.csv').open(newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  verified = dt.date.fromisoformat(row['last_verified'])
                  age = (today - verified).days
                  if age >= 90:
                      stale.append(f"- {row['name']} — {age} days since verification")

          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          if stale:
              summary.write_text('## Stale program entries\n\n' + '\n'.join(stale) + '\n', encoding='utf-8')
              print('\n'.join(stale))
          else:
              summary.write_text('## Freshness check\n\nNo active program is 90+ days old.\n', encoding='utf-8')
              print('No active program is 90+ days old.')
